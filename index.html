
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>National Science Day 2026 | Obsidian Gold Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #000000;
        background-image: radial-gradient(at 0% 0%, hsla(45, 100%, 10%, 1) 0, transparent 50%), 
                          radial-gradient(at 100% 0%, hsla(35, 100%, 5%, 1) 0, transparent 50%);
        background-attachment: fixed;
        min-height: 100vh;
        color: #ffffff;
      }
      .glass-card {
        background: rgba(15, 15, 15, 0.7);
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(212, 175, 55, 0.2);
      }
      .premium-shadow {
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.05);
      }
      .text-highlight {
        color: #ffffff;
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
      }
      .text-gradient {
        background: linear-gradient(to right, #fde68a, #d4af37, #b45309);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 800;
      }

      /* Custom Bottom to Up Animation */
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-slide-up {
        opacity: 0;
        animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .slide-delay-1 {
        animation-delay: 0.2s;
      }

      .slide-delay-2 {
        animation-delay: 0.4s;
      }

      .slide-delay-3 {
        animation-delay: 0.6s;
      }

      .slide-delay-4 {
        animation-delay: 0.8s;
      }

      .slide-delay-5 {
        animation-delay: 1s;
      }

      .slide-delay-6 {
        animation-delay: 1.2s;
      }

      .slide-delay-7 {
        animation-delay: 1.4s;
      }

      ::selection {
        background: rgba(212, 175, 55, 0.4);
        color: white;
      }
      /* Custom scrollbar for premium feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d4af37;
      }
    </style>

  }
}
</script>

</head>

</html>
